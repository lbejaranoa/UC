<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo de Productos</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .contenedor {
            width: 80%;
            max-width: 800px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #0c4b33;
            margin-bottom: 30px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background-color: #f8f9fa;
            margin-bottom: 12px;
            padding: 18px;

            border-left: 5px solid #44b78b;
            border-radius: 8px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            transition: 0.3s;
        }

        li:hover {
            background-color: #e9f7f1;
            transform: translateX(5px);
        }

        .nombre {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .precio {
            font-size: 17px;
            font-weight: bold;
            color: #0c4b33;
        }
        .stock {
            font-size: 17px;
            font-weight: bold;
            color: #35406b;
        }

        .titulo-secundario {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }
    </style>

</head>

<body>

    <div class="contenedor">

        <h1>Catálogo de Productos</h1>

        <p class="titulo-secundario">
            Productos disponibles
        </p>

        <ul>
            {% for producto in arregloproductos %}

                <li>
                    <span class="nombre">
                        {{ producto.nombre }}
                    </span>

                    <span class="precio">
                        S/. {{ producto.precio }}
                    </span>
                    <span class="stock">
                        S/. {{ producto.stock }}
                    </span>
                </li>

            {% endfor %}
        </ul>

    </div>

</body>
</html>
